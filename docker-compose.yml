version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pawaacflow-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-pawaacflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pawaacflow_secret}
      POSTGRES_DB: ${DB_DATABASE:-pawaacflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    networks:
      - pawaacflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-pawaacflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pawaacflow-backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-4000}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME:-pawaacflow}
      DB_PASSWORD: ${DB_PASSWORD:-pawaacflow_secret}
      DB_DATABASE: ${DB_DATABASE:-pawaacflow}
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-true}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your-refresh-secret-key-change-in-production}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      OPENWA_API_URL: ${OPENWA_API_URL:-http://openwa:8080}
      OPENWA_API_KEY: ${OPENWA_API_KEY:-}
      OPENWA_WEBHOOK_SECRET: ${OPENWA_WEBHOOK_SECRET:-}
      OPENWA_ENABLED: ${OPENWA_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-PawaacFlow <noreply@pawaacflow.local>}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pawaacflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: pawaacflow-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pawaacflow-network
    restart: unless-stopped

  openwa:
    image: openwa/wa-automate:latest
    container_name: pawaacflow-openwa
    environment:
      WA_API_KEY: ${OPENWA_API_KEY:-}
      WA_WEBHOOK_URL: http://backend:4000/api/openwa/webhook
      WA_WEBHOOK_EVENTS: message.received
    ports:
      - "8080:8080"
    volumes:
      - openwa_session:/usr/src/app/session
    networks:
      - pawaacflow-network
    restart: unless-stopped

volumes:
  postgres_data:
  openwa_session:

networks:
  pawaacflow-network:
    driver: bridge
